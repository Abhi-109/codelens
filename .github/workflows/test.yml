name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # npm run test:tracer calls `python`, which Ubuntu only ships as `python3`.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tracer tests (Python)
        run: npm run test:tracer

      - name: Visual and teaching layer tests (JS)
        run: npm run test:js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
