<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeLens is a code visualization and programming education platform. Watch a program execute one step at a time — the line about to run, every variable, the call stack and the output, explained in plain English. Python is the first supported language." />
    <title>CodeLens — See your code come to life</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong
      // colours. Mirrors src/theme.js: stored choice, else OS preference,
      // else light.
      (function () {
        try {
          var stored = localStorage.getItem('codelens-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
